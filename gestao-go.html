<!--
  ============================================================
  LOGIN + NUVEM (Firebase) COM PAINEL ADMIN E CADASTRO POR CHAVE
  ============================================================
  - Authentication > Metodo de login > E-mail/senha: ATIVADO (ja esta).
  - Firestore Database > aba Regras: apague tudo, cole as regras abaixo e Publique.
    (sem publicar as regras novas o login e o painel NAO funcionam)
  - Authentication > Configuracoes > Dominios autorizados: inclua o dominio onde o app estiver hospedado.
  - PRIMEIRO ACESSO DO ADMIN: logo depois de publicar as regras, abra o app, toque em
    "Criar conta", digite o usuario davidkannedy e a sua senha e deixe a CHAVE EM BRANCO.
    So o admin pode fazer isso, e so uma vez (depois o nome fica reservado).
  - A senha do admin NAO fica escrita neste arquivo.
  - CADASTRO LIVRE: quem cria conta sem chave ganha 7 dias gratis. Depois disso so a Janela de Troca fecha
    (as contas pessoais continuam). SEMPRE republique as regras abaixo quando este arquivo mudar.
  - Para mudar o nome do admin, troque ADMIN_USER no script e 'davidkannedy' nas regras.

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function hasProfile() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)); }
    function me() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function isAdmin() { return hasProfile() && me().role == 'admin'; }
    function validName(u) { return u is string && u.size() >= 3 && u.size() <= 20 && u.matches('[a-z0-9._-]+'); }
    function keyBefore(k) { return get(/databases/$(database)/documents/keys/$(k)).data; }
    function keyAfter(k) { return getAfter(/databases/$(database)/documents/keys/$(k)).data; }
    function keyBurned(k) { return keyBefore(k).used == false && keyAfter(k).used == true && keyAfter(k).usedBy == request.auth.uid; }
    function notExpired() { return !('expiresAt' in me()) || me().expiresAt > request.time; }
    function profileAfter() { return getAfter(/databases/$(database)/documents/users/$(request.auth.uid)).data; }

    function active() { return hasProfile() && notExpired(); }
    function redeemBase(r) { return (r.get('key', null) != null && r.get('expiresAt', request.time) > request.time) ? r.get('expiresAt', request.time) : request.time; }

    // Perfil de cada pessoa (usuario + papel). Sem perfil = sem acesso a nada.
    match /users/{uid} {
      allow read: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow create: if signedIn() && request.auth.uid == uid
        && request.resource.data.keys().hasOnly(['username','role','key','createdAt','expiresAt'])
        && validName(request.resource.data.username)
        && getAfter(/databases/$(database)/documents/usernames/$(request.resource.data.username)).data.uid == request.auth.uid
        && (
          // primeiro acesso do ADMIN (so vale enquanto o nome nao foi reivindicado)
          (request.resource.data.role == 'admin'
            && request.resource.data.username == 'davidkannedy'
            && request.auth.token.email == 'davidkannedy@gestaogo.app'
            && !exists(/databases/$(database)/documents/usernames/davidkannedy))
          ||
          // usuario comum: precisa de uma chave valida, queimada neste mesmo envio
          (request.resource.data.role == 'user'
            && request.resource.data.username != 'davidkannedy'
            && 'key' in request.resource.data
            && keyBurned(request.resource.data.key)
            && (
              // chave de cadastro: o prazo vem da chave (0 = permanente)
              (keyBefore(request.resource.data.key).type == 'register'
                && ((keyBefore(request.resource.data.key).days == 0 && !('expiresAt' in request.resource.data))
                    || (keyBefore(request.resource.data.key).days > 0
                        && request.resource.data.expiresAt is timestamp
                        && request.resource.data.expiresAt <= request.time + duration.value(keyBefore(request.resource.data.key).days, 'd') + duration.value(1, 'h'))))
              ||
              // chave de recuperacao: mantem o prazo que a pessoa ja tinha
              (keyBefore(request.resource.data.key).type == 'reset'
                && keyBefore(request.resource.data.key).username == request.resource.data.username
                && request.resource.data.get('expiresAt', null) == keyBefore(request.resource.data.key).get('expiresAt', null))
            ))
          ||
          // cadastro livre (sem chave): 7 dias gratis de Janela de Troca
          (request.resource.data.role == 'user'
            && request.resource.data.username != 'davidkannedy'
            && !('key' in request.resource.data)
            && request.resource.data.expiresAt is timestamp
            && request.resource.data.expiresAt <= request.time + duration.value(7, 'd') + duration.value(1, 'h'))
        );
      // admin renova o prazo de acesso de um usuario (so o campo expiresAt)
      allow update: if (isAdmin() && resource.data.role != 'admin'
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['expiresAt']))
        ||
        // usuario ativa uma chave de cadastro na propria conta (queima a chave no mesmo envio)
        (signedIn() && request.auth.uid == uid && resource.data.role == 'user'
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['key','expiresAt'])
        && 'key' in request.resource.data
        && keyBurned(request.resource.data.key)
        && keyBefore(request.resource.data.key).type == 'register'
        && ((keyBefore(request.resource.data.key).days == 0 && !('expiresAt' in request.resource.data))
            || (keyBefore(request.resource.data.key).days > 0
                && request.resource.data.expiresAt is timestamp
                && request.resource.data.expiresAt <= redeemBase(resource.data) + duration.value(keyBefore(request.resource.data.key).days, 'd') + duration.value(1, 'h'))));
      allow delete: if isAdmin() && resource.data.role != 'admin';
    }

    // Reserva de nomes de usuario (e versao do login, usada na recuperacao de senha)
    match /usernames/{u} {
      allow get: if true;
      allow list: if isAdmin();
      allow create: if signedIn() && validName(u)
        && request.resource.data.keys().hasOnly(['uid','ver','deleted'])
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.ver == 0
        && request.resource.data.deleted == false
        && profileAfter().username == u;
      allow update: if signedIn()
        && request.resource.data.keys().hasOnly(['uid','ver','deleted'])
        && (
          // admin exclui usuario
          (isAdmin() && u != 'davidkannedy'
            && resource.data.deleted == false
            && request.resource.data.deleted == true
            && request.resource.data.ver == resource.data.ver + 1)
          ||
          // nome liberado, reutilizado com chave de cadastro
          (resource.data.deleted == true
            && request.resource.data.deleted == false
            && request.resource.data.uid == request.auth.uid
            && request.resource.data.ver == resource.data.ver
            && profileAfter().username == u
            && (!('key' in profileAfter()) || keyAfter(profileAfter().key).type == 'register'))
          ||
          // recuperacao de senha com chave de recuperacao
          (resource.data.deleted == false
            && request.resource.data.deleted == false
            && u != 'davidkannedy'
            && request.resource.data.uid == request.auth.uid
            && request.resource.data.ver == resource.data.ver + 1
            && profileAfter().username == u
            && keyAfter(profileAfter().key).type == 'reset')
        );
    }

    // Chaves de uso unico (so o admin cria e lista)
    match /keys/{k} {
      allow get: if signedIn();
      allow list: if isAdmin();
      allow create: if isAdmin()
        && request.resource.data.keys().hasOnly(['type','username','days','expiresAt','used','usedBy','usedByName','usedAt','createdAt'])
        && request.resource.data.used == false
        && request.resource.data.type in ['register','reset']
        && (request.resource.data.type == 'reset' || request.resource.data.days in [0, 7, 30]);
      allow update: if signedIn()
        && resource.data.used == false
        && request.resource.data.used == true
        && request.resource.data.usedBy == request.auth.uid
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['used','usedBy','usedByName','usedAt']);
      allow delete: if isAdmin();
    }

    // ===== JANELA DE TROCA =====
    // Perfil publico de troca (codigo de amizade de 12 numeros)
    match /tradeProfiles/{u} {
      allow read: if active();
      allow create, update: if active() && me().username == u
        && request.resource.data.keys().hasOnly(['username','friendCode','nick','updatedAt'])
        && request.resource.data.username == u
        && request.resource.data.friendCode is string
        && request.resource.data.friendCode.matches('[0-9]{12}')
        && request.resource.data.nick is string
        && request.resource.data.nick.size() <= 30;
      allow delete: if isAdmin() || (active() && me().username == u);
    }

    // Pokemon que a pessoa procura (want) ou oferece (offer)
    match /tradeItems/{id} {
      allow read: if active();
      allow create: if active()
        && request.resource.data.keys().hasOnly(['owner','kind','dex','name','fk','sp','sh','t','note','ph','createdAt'])
        && request.resource.data.owner == me().username
        && exists(/databases/$(database)/documents/tradeProfiles/$(me().username))
        && request.resource.data.kind in ['want','offer']
        && request.resource.data.sh in ['y','p','n']
        && request.resource.data.name is string && request.resource.data.name.size() <= 80
        && request.resource.data.note is string && request.resource.data.note.size() <= 120;
      allow delete: if isAdmin() || (active() && resource.data.owner == me().username);
    }

    // Foto de um item (fica separada para a lista de jogadores carregar leve)
    match /tradePhotos/{id} {
      allow read: if active();
      allow create: if active()
        && request.resource.data.keys().hasOnly(['owner','img'])
        && request.resource.data.owner == me().username
        && request.resource.data.img is string && request.resource.data.img.size() < 700000;
      allow delete: if isAdmin() || (active() && resource.data.owner == me().username);
    }

    // Chat geral
    match /chatGlobal/{id} {
      allow read: if active();
      allow create: if active()
        && request.resource.data.keys().hasOnly(['u','text','img','ts'])
        && request.resource.data.u == me().username
        && request.resource.data.ts == request.time
        && request.resource.data.text is string && request.resource.data.text.size() <= 400
        && (request.resource.data.text.size() > 0 || 'img' in request.resource.data)
        && (!('img' in request.resource.data) || (request.resource.data.img is string && request.resource.data.img.size() < 250000));
      allow delete: if isAdmin() || (active() && resource.data.u == me().username);
    }

    // Conversas privadas (id = dois usuarios em ordem alfabetica separados por __)
    match /dms/{cid} {
      allow read: if active() && me().username in resource.data.users;
      allow create: if active()
        && request.resource.data.keys().hasOnly(['users','last','lastBy','lastAt'])
        && request.resource.data.users.size() == 2
        && request.resource.data.users[0] < request.resource.data.users[1]
        && cid == request.resource.data.users[0] + '__' + request.resource.data.users[1]
        && me().username in request.resource.data.users
        && request.resource.data.lastBy == me().username
        && request.resource.data.lastAt == request.time
        && request.resource.data.last.size() <= 60;
      allow update: if active() && me().username in resource.data.users
        && request.resource.data.users == resource.data.users
        && request.resource.data.lastBy == me().username
        && request.resource.data.lastAt == request.time
        && request.resource.data.last.size() <= 60;
      match /msgs/{mid} {
        allow read: if active() && me().username in get(/databases/$(database)/documents/dms/$(cid)).data.users;
        allow create: if active()
          && me().username in getAfter(/databases/$(database)/documents/dms/$(cid)).data.users
          && request.resource.data.keys().hasOnly(['u','text','img','ts'])
          && request.resource.data.u == me().username
          && request.resource.data.ts == request.time
          && request.resource.data.text is string && request.resource.data.text.size() <= 400
          && (request.resource.data.text.size() > 0 || 'img' in request.resource.data)
          && (!('img' in request.resource.data) || (request.resource.data.img is string && request.resource.data.img.size() < 250000));
        allow delete: if isAdmin() || (active() && resource.data.u == me().username);
      }
    }

    // Denuncias (so o admin le e apaga)
    match /reports/{id} {
      allow create: if active()
        && request.resource.data.keys().hasOnly(['by','target','kind','path','text','img','createdAt'])
        && request.resource.data.by == me().username
        && request.resource.data.kind in ['gmsg','dm','item']
        && request.resource.data.path.matches('(chatGlobal/[A-Za-z0-9]+|dms/[a-z0-9._-]+__[a-z0-9._-]+/msgs/[A-Za-z0-9]+|tradeItems/[A-Za-z0-9]+)')
        && request.resource.data.text.size() <= 200
        && (!('img' in request.resource.data) || request.resource.data.img.size() < 700000);
      allow read, delete: if isAdmin();
    }

    // Dados do app: cada pessoa so ve os proprios (o documento tem o nome do usuario)
    // (continua funcionando depois dos 7 dias; so a Janela de Troca fecha)
    match /gestao/{id} {
      allow read: if signedIn() && (request.auth.uid == id || (hasProfile() && me().username == id));
      allow write: if hasProfile() && me().username == id;
      allow delete: if isAdmin();
    }
  }
}
-->
<style>

button,input,select,textarea{font:inherit;color:inherit}

.gbox h2{font:800 22px/1.1 'Bricolage Grotesque',sans-serif;margin:0 0 6px}
.gbox p{color:var(--mut);margin:0 0 12px}
.gbox .in{margin-bottom:8px}
#lb{align-items:center;padding:12px;z-index:90}
#lbImg{max-width:100%;max-height:90vh;border-radius:12px;background:#fff}
.lg{font-size:12px;color:var(--mut);margin:6px 0 0}
.mon img.art,.who img.art,.strip img.art{image-rendering:auto}
nav button[hidden]{display:none}
.kbox{font:800 20px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--soft);border:2px dashed var(--ink);border-radius:12px;padding:14px;margin:10px 0;text-align:center;word-break:break-all;user-select:all;-webkit-user-select:all}
.krow,.urow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.krow code{font:700 14px ui-monospace,Menlo,Consolas,monospace;flex:1 1 200px;word-break:break-all}
.urow b{flex:1 1 110px;word-break:break-all}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft)}
.badge.a{background:#FFF0BF}.badge.w{background:#FDE2E4;color:var(--red)}
.btn.s{min-height:34px;padding:6px 10px;font-size:13px}
#instBar{display:none;align-items:center;gap:8px;width:calc(100% - 32px);max-width:1068px;margin:10px auto 0;padding:10px 12px 10px 14px;background:var(--yel);color:var(--ink);border-radius:var(--r);font-weight:700}
#instBar span{flex:1;line-height:1.25}

#instX{background:transparent;font-size:18px;padding:6px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 8px;margin:14px 0}
.tc{position:relative;background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:14px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tc.want{border-color:var(--red);background:#FFF5F6}
.tc.offer{border-color:#2F6FE0;background:#F2F7FF}
.tk{position:absolute;top:-10px;left:8px;color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px}
.tc.want .tk{background:var(--red)}.tc.offer .tk{background:#2F6FE0}
.tc>img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated}
.tc>img.art{image-rendering:auto}
.tc .nm{font-weight:700;font-size:13px;line-height:1.2}
.tc .dx{font-size:11px;color:var(--mut)}
.tc .bd{font-size:15px;min-height:20px}
.tc .nt{font-size:11px;color:var(--mut);line-height:1.2}
.pcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font:800 20px 'Bricolage Grotesque',sans-serif;flex:none}
.minis{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.mi{display:inline-flex;border:2px solid;border-radius:8px;background:#fff}
.mi.want{border-color:var(--red)}.mi.offer{border-color:#2F6FE0}
.mi img{width:34px;height:34px;image-rendering:pixelated;object-fit:contain}
.mi img.art{image-rendering:auto}
.chat{display:flex;flex-direction:column;gap:6px;max-height:55vh;min-height:180px;overflow:auto;padding:8px;background:#fff;border:2px solid var(--line);border-radius:var(--r)}
.msg{max-width:88%;align-self:flex-start;background:var(--soft);border-radius:12px;padding:6px 10px}
.msg.me{align-self:flex-end;background:#FFF0BF}
.msg .au{font-size:12px;font-weight:700;color:var(--mut)}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.msg img.ci{max-width:100%;max-height:220px;border-radius:8px;display:block;margin-top:4px;cursor:zoom-in}
.msg .ma{display:flex;gap:4px;justify-content:flex-end}
.msg .ma button{border:0;background:transparent;font-size:14px;padding:2px 6px;opacity:.7}
.lnk{border:0;background:none;padding:0;font-weight:700;color:inherit;text-decoration:underline}
.comp{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.comp textarea{flex:1;min-height:44px;max-height:100px;resize:none}
.pend{display:flex;align-items:center;gap:8px;margin-top:8px}
.pend img{max-height:70px;border-radius:8px}
.tc>img.phimg{width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:10px;image-rendering:auto;cursor:zoom-in;background:#E3EBF1}
.fdet{padding:10px 14px;margin:10px 0}.fdet summary{font-weight:800;cursor:pointer}

function idbo(mode,fn){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('noidb'));return;}
    var r=indexedDB.open('gestgo-photos',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('p');};
    r.onerror=function(){rej(r.error);};
    r.onsuccess=function(){var db=r.result,tx=db.transaction('p',mode),q=fn(tx.objectStore('p'));tx.oncomplete=function(){res(q&&q.result);db.close();};tx.onerror=function(){rej(tx.error);};};
  });
}
function idbPut(k,v){return idbo('readwrite',function(s){return s.put(v,k);});}
function idbGet(k){return idbo('readonly',function(s){return s.get(k);});}
function idbDel(k){return idbo('readwrite',function(s){return s.delete(k);});}

var FOP='and';
function rng(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}

var DX_LEG=setOf([144,145,146,150,243,244,245,249,250].concat(rng(377,384),[480,481,482,483,484,485,486,487,488],rng(638,646),[716,717,718,772,773],rng(785,792),[800,888,889,890,891,892],rng(894,898),[905],rng(1001,1004),[1007,1008,1024]));

function oneF(m,f){
  if(f==='leg')return !!DX_LEG[m.dex];
  if(f==='myt')return !!DX_MYT[m.dex];
  if(f==='ub')return !!DX_UB[m.dex];
  if(f==='par')return !!DX_PAR[m.dex];
  if(f==='crown')return /crowned|coroad/i.test((m.fk||'')+' '+(m.name||''));
  if(f==='y'||f==='p'||f==='n')return m.sh===f;
  if(f==='it')return /[PGC]/.test(m.t);
  if(f==='ph')return !!m.ph;
  if(f==='D')return m.t.indexOf('D')>=0||m.fk==='dmax';
  if(f==='mega'||f==='gmax'||f==='reg'||f==='alt')return kindOf(m.fk)===f;
  return m.t.indexOf(f)>=0;
}
function passes(m,ff){
  var f=ff||V.f; if(!f.length)return true;
  return FOP==='or'?f.some(function(k){return oneF(m,k);}):f.every(function(k){return oneF(m,k);});
}
function togF(arr,k){
  if(k==='all'){arr.length=0;return;}
  var i=arr.indexOf(k);
  if(i>=0){arr.splice(i,1);return;}
  if(k==='y'||k==='p'||k==='n'){['y','p','n'].forEach(function(x){var j=arr.indexOf(x);if(j>=0)arr.splice(j,1);});}
  arr.push(k);
}
function chipsH(attr,arr){

}
function opH(){

}
function syncChips(attr,arr){

}
function syncOp(){var o=document.querySelectorAll('[data-fop]');for(var i=0;i<o.length;i++)o[i].setAttribute('aria-pressed',String(o[i].getAttribute('data-fop')===FOP));}
function renderAcc(){

  if(a.nick||a.code||a.note) h+='<p style="margin:0 0 8px;color:#5D6B82">'+esc([a.nick&&'Nick: '+a.nick,a.code&&'Código: '+a.code,a.note].filter(Boolean).join(' · '))+'</p>';
  h+='<div class="tools"><input class="in" id="aq" type="search" placeholder="Buscar nome, número ou anotação" value="'+esc(V.q)+'"></div><div class="chips" role="group" aria-label="Filtro">'+
    chipsH('data-f',V.f)+'</div>'+opH()+'<div class="chips" style="margin-top:8px" role="group" aria-label="Modo"><button type="button" class="chip" data-vmode="list" aria-pressed="'+(V.mode==='list')+'">Todos os Pokémon</button><button type="button" class="chip" data-vmode="sp" aria-pressed="'+(V.mode==='sp')+'">Espécies diferentes</button></div>'+
    '<p id="alc" style="color:#5D6B82;margin:10px 0 8px"></p><div id="alist"></div>';

function matchQ(m,q){
  if(!q)return true;
  return norm(m.name).indexOf(q)>=0||String(m.dex)===q.replace('#','')||norm(m.note||'').indexOf(q)>=0;
}
function drawList(){
  var a=acc(V.acc),q=norm(V.q),box=$('alist'); if(!a||!box)return;
  var list=a.mons.filter(function(m){return passes(m)&&matchQ(m,q);}).sort(function(x,y){return x.dex-y.dex||x.name.localeCompare(y.name);});
  if(V.mode==='sp'){
    var g={},order=[];
    list.forEach(function(m){var o=g[m.name];if(!o){o=g[m.name]={m:m,n:0,y:0};order.push(m.name);}o.n+=(m.q||1);if(m.sh==='y'){o.y++;if(o.m.sh!=='y')o.m=m;}});
    $('alc').textContent=order.length+' espécies diferentes · '+list.length+' Pokémon de '+a.mons.length;
    box.innerHTML=order.length?'<div class="grid">'+order.map(function(k){var o=g[k];
      return '<button type="button" class="mon '+(o.y?'y':'n')+'" data-spf="'+esc(k)+'">'+(o.n>1?'<span class="cnt">×'+o.n+'</span>':'')+img(o.m)+'<div class="nm">'+esc(k)+'</div><div class="dx">#'+('000'+o.m.dex).slice(-3)+'</div></button>';}).join('')+'</div>':'<div class="empty">'+(a.mons.length?'Nada com esse filtro.':'Esta conta ainda está vazia. Toque no + para adicionar.')+'</div>';

function drawAll(){
  var box=$('glist'); if(!box)return;

    a.mons.forEach(function(m){if(passes(m,G.f)&&matchQ(m,q))list.push({a:a,m:m});});
  });
  list.sort(function(x,y){return x.m.dex-y.m.dex||x.m.name.localeCompare(y.m.name);});
  var spc={},shc=0; list.forEach(function(e){spc[e.m.name]=1;if(e.m.sh==='y')shc++;});

    if(!o.by[e.a.id])o.by[e.a.id]={a:e.a,n:0};o.by[e.a.id].n++;});
  box.innerHTML='<div class="grid">'+order.map(function(k){var o=g[k];
    return '<button type="button" class="mon '+(o.y?'y':'n')+'" data-who="'+esc(k)+'">'+(o.n>1?'<span class="cnt">×'+o.n+'</span>':'')+img(o.m)+'<div class="nm">'+esc(k)+'</div><div class="dx">#'+('000'+o.m.dex).slice(-3)+'</div><div class="dots">'+
      Object.keys(o.by).map(function(id){var x=o.by[id];return '<i style="border-left:4px solid '+x.a.color+'">'+esc(x.a.name)+(x.n>1?' ×'+x.n:'')+'</i>';}).join('')+'</div></button>';}).join('')+'</div>';
}

function parseList(txt,allSh){
  var map={},ok=[],bad=[],stop=false;
  SP.forEach(function(s){map[nk(s.name)]=s;});
  function byId(i){return SP.filter(function(s){return s.id===i;})[0];}
  txt.split(/\r?\n/).forEach(function(raw){
    var line=raw.replace(/\*\*|`/g,'').trim();
    if(stop)return;
    if(ok.length&&/^#{1,6}\s/.test(line)){stop=true;return;}
    if(!line||/^(#\s|##|---|>)/.test(line)||/^(legenda|resumo|a confirmar)/i.test(norm(line)))return;
    line=line.replace(/^(\d+\s*[\.\)]\s+|[-*•]\s+)/,'').trim();
    var segm=line.split(/\s*(?:—|–|·|\(|\[|:|\s-\s)/);
    var seg=segm[0].replace(/[✨⭐\uFE0F]/g,'').trim();
    if(!seg)return;
    var qty=1,mq;
    if((mq=seg.match(/^(\d+)\s*[x×]\s+(.+)$/i))){qty=+mq[1];seg=mq[2];}
    else if((mq=seg.match(/^(.+?)\s*[x×]\s*(\d+)$/i))){qty=+mq[2];seg=mq[1];}
    var form='',fm=seg.match(/\s*\b(?:de\s+|da\s+|do\s+)?(alola|alolan|alolano|hisui|hisuian|hisuiano|galar|galarian|galariano|paldea|paldean|paldeano)\b/i);
    if(fm){var fl=fm[1].toLowerCase();form=fl.indexOf('alol')===0?'alola':fl.indexOf('hisui')===0?'hisui':fl.indexOf('galar')===0?'galar':'paldea';seg=seg.replace(fm[0],'').trim();}
    var nl=norm(line),mg2=/\bmega\b/.test(nl),gm2=/\b(gigantamax|gigamax|gmax)\b/.test(nl),pr2=/\b(primal|primordial)\b/.test(nl),dn2=/\b(dinamax|dynamax)\b/.test(nl);
    var segn=norm(seg),xy=(nl.match(/\bmega[\s-]*([xy])\b/)||segn.match(/\s([xy])$/)||[])[1]||'';
    if(mg2||gm2||pr2||dn2){seg=seg.replace(/\b(gigantamax|gigamax|gmax|mega|primal|primordial|dinamax|dynamax)\b/ig,'').replace(/\s+/g,' ').trim();if(mg2&&xy)seg=seg.replace(/\s+[xyXY]$/,'').trim();}
    var sp=null,mm;
    if((mm=seg.match(/^#?(\d{1,4})$/)))sp=byId(+mm[1]);
    else if((mm=seg.match(/^#?(\d{1,4})\s+(.+)$/)))sp=map[nk(mm[2])];
    else sp=map[nk(seg.replace('♀','f').replace('♂','m'))];
    if(!sp){if(raw.length<=90||/^\s*(\d+[\.\)]|[-*•]\s*\*\*)/.test(raw))bad.push(raw.trim());return;}
    var n=norm(line),t='';
    function has(re){return re.test(n);}
    if(has(/sombrio|shadow/))t+='S';
    if(has(/sortudo|lucky/))t+='L';
    var party=has(/festa|party/);
    if(party)t+='P';
    if(has(/oculos|goggles/))t+='G';
    if(has(/\b(fantasia|traje|quepe|bone|jaleco|peruca|cabelo|camiseta|lenco|coroa|vestido|roupa|costume|palha|explorador|cowboy|capitao|astronauta)\b/)||(has(/\bchapeu\b/)&&!party))t+='C';
    if(line.indexOf('🖼')>=0||has(/fundo especial/)||(has(/\bfundo\b|background/)&&!has(/padrao|normal|escuro|dourado|desbotado/)))t+='B';
    if(has(/\biv ?100\b|100%|\bhundo\b/)||line.indexOf('💯')>=0)t+='I';
    if(has(/femea|female/)||line.indexOf('♀')>=0)t+='F';
    if(has(/\bmacho\b|\bmale\b/)||line.indexOf('♂')>=0)t+='M';
    if(dn2)t+='D';
    var sh;
    if(allSh)sh='y';
    else if(/✨/.test(line)||has(/brilhante|shiny|shine/)){sh=(/✨\s*\?/.test(line)||has(/incerto|provavel|brilhante\?/))?'p':'y';}
    else sh='n';
    var note=line.substring(segm[0].length).replace(/\b(gigantamax|gigamax|gmax|mega|primal|primordial|dinamax|dynamax)\b/ig,'').replace(/[✨🎩🥽🌑🍀🖼🏷💯\uFE0F]/g,'').replace(/sem item/ig,'').replace(/[\(\)\[\]\*]/g,' ').replace(/;/g,' · ').replace(/(^|[\s·—–])\?(?=[\s·—–]|$)/g,'$1').replace(/\s*[—–·]\s*/g,' · ').replace(/(?:\s*·\s*){2,}/g,' · ').replace(/\s+/g,' ').replace(/^[\s·\-:]+|[\s·\-:]+$/g,'').slice(0,120);
    var fk=form,fl2=formsFor(sp.id);
    if(form==='paldea'&&sp.id===128)fk=has(/aqua|agua/)?'paldea-aqua-breed':has(/chama|blaze|fogo|fire/)?'paldea-blaze-breed':'paldea-combat-breed';
    else if(!form){
      if(gm2){var gl=fl2.filter(function(f){return kindOf(f.k)==='gmax';});fk=(gl.filter(function(f){return has(/fluido|rapid/)===/rapid/.test(f.k);})[0]||gl[0]||{k:'gmax'}).k;}
      else if(mg2||pr2){fk=pr2?'primal':(xy?'mega-'+xy:'mega');if(!fl2.some(function(f){return f.k===fk;})){var mf=fl2.filter(function(f){return kindOf(f.k)==='mega';})[0];if(mf)fk=mf.k;}}
      else{
        if(dn2&&DMAXSET[sp.id])fk='dmax';
        var al=fl2.filter(function(f){return kindOf(f.k)==='alt';});
        al.forEach(function(f){if(fk)return;var terms=[norm(lbl(f.k)),f.k.replace(/-/g,' ')];if(terms.some(function(tm){return tm.length>3&&new RegExp('\\b'+tm+'\\b').test(n);}))fk=f.k;});

    ok.push({sp:sp,qty:qty,name:mkName(sp.id,fk)||sp.name,fk:fk,spid:spid,sh:sh,t:t,note:note});
  });
  return {ok:ok,bad:bad};
}

function show(tab,accId){
  if(tab==='acc'&&accId){var la=acc(accId);if(!la||isLocked(la)){toast('Conta bloqueada 🔒');tab='home';accId=null;}}
  if(tab==='adm'&&!isAdm())tab='home';V.tab=tab;if(tab!=='trade')tStop(); if(accId){V.acc=accId;V.f=[];V.q='';V.mode='list';}
  var key=tab==='home'&&false?'':tab;
  ['home','acc','all','who','bkp','adm','trade'].forEach(function(x){$('v-'+x).className='view'+(x===tab?' on':'');});
  var nt=tab==='acc'?'home':tab, nb=document.querySelectorAll('nav button');
  for(var i=0;i<nb.length;i++)nb[i].setAttribute('aria-selected',nb[i].getAttribute('data-tab')===nt?'true':'false');
  $('fab').className='fab'+(tab==='acc'?' on':'');
  draw(); window.scrollTo(0,0);
}
function draw(){
  enforce();
  var t=0;AC().forEach(function(a){t+=a.mons.length;});
  $('sub').textContent=AC().length+' contas · '+t+' Pokémon registrados'+(limited()?' · '+(D.accounts.length-AC().length)+' 🔒':'');
  if(limited()&&!selIds().length&&!PKSHOWN&&$('md').className.indexOf('on')<0){PKSHOWN=true;setTimeout(openPick,0);}
  if(V.tab==='home')renderHome();else if(V.tab==='acc')renderAcc();else if(V.tab==='all')renderAll();else if(V.tab==='who')renderWho();else if(V.tab==='adm')renderAdm();else if(V.tab==='trade')renderTrade();else renderBkp();
}

/* ---------- Eventos ---------- */
document.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG')return;var fb=t.getAttribute('data-fb');if(!fb){if(t.hasAttribute('data-fb'))t.style.visibility='hidden';return;}var l=fb.split('|'),nx=l.shift();t.setAttribute('data-fb',l.join('|'));t.src=nx;},true);
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(e.target.id==='lb'||e.target.id==='lbImg'){$('lb').className='modal';return;}
  var zm=e.target.closest?e.target.closest('[data-zoom]'):null;
  if(zm&&zm.getAttribute('data-zoom')){$('lbImg').src=zm.getAttribute('data-zoom');$('lb').className='modal on';return;}
  var tg=e.target.closest?e.target.closest('[data-tog]'):null;
  if(tg){toggleSh(tg.getAttribute('data-ac'),tg.getAttribute('data-tog'));return;}
  var mc=e.target.closest?e.target.closest('[data-mon]'):null;
  if(mc){openMon(mc.getAttribute('data-ac'),mc.getAttribute('data-mon'));return;}
  if(e.target.id==='md'){$('md').className='modal';return;}
  if(!b)return;
  if(b.hasAttribute('data-tab')){show(b.getAttribute('data-tab'));return;}
  if(b.hasAttribute('data-acc')){show('acc',b.getAttribute('data-acc'));return;}
  if(b.hasAttribute('data-back')){show('home');return;}
  if(b.hasAttribute('data-editacc')){openAcc();return;}
  if(b.hasAttribute('data-newacc')){openNewAcc();return;}
  if(b.hasAttribute('data-ncolor')){naKeep();NA.color=b.getAttribute('data-ncolor');$('mdBox').innerHTML=newAccH();return;}
  if(b.id==='naSave'){
    naKeep();
    if(!canAdd()){$('md').className='modal';openUpsell('Você já está com '+FREE_ACC+' contas e não dá para adicionar mais sem uma Key.');return;}
    var nn=(NA.name||'').trim()||('Conta '+(D.accounts.length+1));
    var na={id:'a'+uid(),name:nn,nick:(NA.nick||'').trim(),code:(NA.code||'').trim(),note:(NA.note||'').trim(),color:NA.color||COLORS[0],mons:[]};
    D.accounts.push(na);save();$('md').className='modal';toast('Conta adicionada');draw();return;}
  if(b.hasAttribute('data-lockacc')){lockedClick();return;}
  if(b.hasAttribute('data-pick')){openPick();return;}
  if(b.hasAttribute('data-upsell')){openUpsell('Você está no plano grátis, com limite de '+FREE_ACC+' contas.');return;}
  if(b.hasAttribute('data-pk')){var pid=b.getAttribute('data-pk'),px=PK.indexOf(pid),pn=Math.min(FREE_ACC,D.accounts.length);if(px>=0)PK.splice(px,1);else if(PK.length<pn)PK.push(pid);else{toast('Só dá para escolher '+pn);return;}$('mdBox').innerHTML=pickH();return;}
  if(b.id==='pkOk'){if(PK.length!==Math.min(FREE_ACC,D.accounts.length))return;D.sel=PK.slice();save();$('md').className='modal';toast('Contas escolhidas ✅');draw();return;}
  if(b.id==='fab'){openMon(V.acc,null);return;}
  if(b.hasAttribute('data-mon')){openMon(V.acc,b.getAttribute('data-mon'));return;}
  if(b.hasAttribute('data-f')){togF(V.f,b.getAttribute('data-f'));syncChips('data-f',V.f);drawList();return;}
  if(b.hasAttribute('data-fop')){FOP=b.getAttribute('data-fop');syncOp();if(V.tab==='acc')drawList();else drawAll();return;}
  if(b.hasAttribute('data-vmode')){V.mode=b.getAttribute('data-vmode');var vm=document.querySelectorAll('[data-vmode]');for(var vi=0;vi<vm.length;vi++)vm[vi].setAttribute('aria-pressed',String(vm[vi]===b));drawList();return;}
  if(b.hasAttribute('data-spf')){V.q=b.getAttribute('data-spf');V.mode='list';renderAcc();window.scrollTo(0,0);return;}
  if(b.hasAttribute('data-uniq')){G.mode='sp';G.f=['y'];G.acc='all';G.q='';show('all');return;}
  if(b.hasAttribute('data-flag')){var k=b.getAttribute('data-flag');M.t=M.t.indexOf(k)>=0?M.t.replace(k,''):M.t+k;b.setAttribute('aria-pressed',M.t.indexOf(k)>=0?'true':'false');return;}
  if(b.hasAttribute('data-sp')){var id=+b.getAttribute('data-sp');M.dex=id;M.name=SPN[id];M.sp=0;$('mName').value=M.name;$('sug').innerHTML='';$('pick').textContent='✓ '+M.name+' #'+id;M.fk='';M.cs='';refreshForms();return;}
  if(b.hasAttribute('data-color')){var a=acc(V.acc);a.color=b.getAttribute('data-color');save();openAcc();return;}
  if(b.id==='authBtn'){openAuthModal();return;}
  if(b.id==='lgIn'){doLogin();return;}
  if(b.id==='lgUp'){doRegister();return;}
  if(b.id==='lgRec'){doReset();return;}
  if(b.id==='lgGoUp'){showGate('up');return;}
  if(b.id==='lgGoRec'){showGate('rec');return;}
  if(b.id==='lgBack'){showGate('in');return;}
  if(b.id==='rkOpen'){openRedeem();return;}
  if(b.id==='rkGo'){doRedeem();return;}
  if(b.id==='pwChg'){openPwModal();return;}
  if(b.id==='admDm'){$('md').className='modal';var tb=document.querySelector('[data-tab="trade"]');if(tb)tb.click();setTimeout(function(){tOpenDm(ADMIN_USER);},50);return;}
  if(b.id==='pwaInst'){$('md').className='modal';window.pwaInstall();return;}
  if(b.id==='pwGo'){doPw();return;}
  if(b.hasAttribute('data-adm')){admAct(b);return;}
  if(b.id==='syncNow'){$('md').className='modal';toast('Sincronizando…');startSync().then(function(){toast(SYNC==='err'?'Falhou: '+(SYNCERR||'erro'):'Sincronizado');});return;}
  if(b.id==='lgOut'){doLogout();return;}
  if(b.id==='phPick'){$('mFile').click();return;}
  if(b.id==='phRm'){M.file=null;M.rm=true;renderPh();return;}
  if(b.id==='bkSeed'){var pa=AC()[0];if(!pa){toast('Nenhuma conta liberada');return;}if(pa.mons.length&&!confirm('A conta "'+pa.name+'" já tem Pokémon. Adicionar a lista inicial mesmo assim?'))return;seedMons().forEach(function(m){pa.mons.push(m);});save();toast('Lista inicial carregada');draw();return;}
  if(b.hasAttribute('data-allsh')){var sa=acc(V.acc);if(!sa||!sa.mons.length)return;if(!confirm('Marcar todos os '+sa.mons.length+' Pokémon de "'+sa.name+'" como Shine?'))return;sa.mons.forEach(function(m){m.sh='y';});save();drawList();toast('Todos marcados como ✨ Shine');return;}
  if(b.hasAttribute('data-import')){openImport(b.getAttribute('data-import')||'a1');return;}
  if(b.hasAttribute('data-gf')){togF(G.f,b.getAttribute('data-gf'));syncChips('data-gf',G.f);drawAll();return;}
  if(b.hasAttribute('data-gmode')){G.mode=b.getAttribute('data-gmode');var gm=document.querySelectorAll('[data-gmode]');for(var gj=0;gj<gm.length;gj++)gm[gj].setAttribute('aria-pressed',gm[gj]===b?'true':'false');drawAll();return;}
  if(b.hasAttribute('data-who')){WQ=b.getAttribute('data-who');show('who');return;}
  if(b.id==='iRead'){readImport();return;}
  if(b.id==='iGo'){applyImport();return;}
  if(b.id==='iFileBtn'){$('iFile').click();return;}
  if(b.id==='mNo'){$('md').className='modal';return;}
  if(b.id==='mSave'){saveMon(false);return;}
  if(b.id==='mMore'){saveMon(true);return;}
  if(b.id==='mDel'){
    if(!confirm('Excluir este Pokémon da conta?'))return;
    var ac=acc(M.acc),gone=ac.mons.filter(function(x){return x.id===M.mon;})[0];ac.mons=ac.mons.filter(function(x){return x.id!==M.mon;});if(gone&&gone.ph)removePhoto(gone);save();$('md').className='modal';toast('Excluído');draw();return;}
  if(b.id==='aSave'){var ca=acc(V.acc);ca.name=$('aName').value.trim()||ca.name;ca.nick=$('aNick').value.trim();ca.code=$('aCode').value.trim();ca.note=$('aNote').value.trim();save();$('md').className='modal';draw();return;}
  if(b.id==='bkDown'){
    var blob=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
    l.href=u;l.download='minhas-contas-go-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();document.body.removeChild(l);setTimeout(function(){URL.revokeObjectURL(u);},1000);toast('Backup baixado');return;}
  if(b.id==='bkCopy'){
    var txt=JSON.stringify(D);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Backup copiado');},function(){toast('Não consegui copiar');});
    else toast('Seu navegador não permite copiar. Use Baixar.');return;}
  if(b.id==='bkFile'){$('bkIn').click();return;}
  if(b.id==='bkImp'){var t2=$('bkTxt').value.trim();if(!t2){toast('Cole o backup primeiro');return;}if(confirm('Isso substitui tudo. Continuar?'))importData(t2);return;}
  if(b.id==='bkReset'){if(confirm('Apagar tudo e recomeçar?')){D=defaults();save();toast('Recomeçado');show('home');}return;}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='aq'){V.q=t.value;drawList();}
  else if(t.id==='wq'){WQ=t.value;drawWho();}
  else if(t.id==='gq'){G.q=t.value;drawAll();}
  else if(t.id==='mName'){M.dex=0;M.name='';M.fk='';M.cs='';$('pick').textContent='';suggest(t.value);var q9=norm(t.value).trim(),ex=q9&&SP.filter(function(x){return norm(x.name)===q9;})[0];if(ex){M.dex=ex.id;M.name=ex.name;M.sp=0;$('pick').textContent='✓ '+ex.name+' #'+ex.id;}refreshForms();}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='lgP'||e.target.id==='lgU'||e.target.id==='lgK')){if(GMODE==='in')doLogin();else if(GMODE==='up')doRegister();else doReset();}});
document.addEventListener('change',function(e){
  if(e.target.id==='mForm'){M.fk=e.target.value;return;}
  if(e.target.id==='mCos'){M.cs=e.target.value;return;}
  if(e.target.id==='mBg'){M.bg=e.target.value;return;}
  if(e.target.id==='tiBg'){TI.bg=e.target.value;return;}
  if(e.target.id==='tiCos'){TI.cs=e.target.value;return;}
  if(e.target.id==='mFile'&&e.target.files[0]){var pf=e.target.files[0];if(pf.size>40*1024*1024){toast('Foto muito grande (máximo 40 MB)');return;}M.file=pf;M.rm=false;renderPh();return;}
  if(e.target.id==='gacc'){G.acc=e.target.value;drawAll();return;}
  if(e.target.id==='iFile'&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){$('iTxt').value=String(fr.result);readImport();};fr.readAsText(e.target.files[0]);return;}
  if(e.target.id==='bkIn'&&e.target.files[0]){var r=new FileReader();r.onload=function(){if(confirm('Isso substitui tudo. Continuar?'))importData(String(r.result));};r.readAsText(e.target.files[0]);}
});

/* ---------- Lista de espécies (para o autocomplete) ---------- */
function setSpecies(l){SP=l;SPN={};l.forEach(function(s){SPN[s.id]=s.name;});}
function cap(n){return n.split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');}
(function(){
  var c=null;try{c=JSON.parse(localStorage.getItem(LSP)||'null');}catch(e){}
  if(c&&c.length>1000){setSpecies(c);loadForms();return;}
  var seen={},tmp=[];
  AC().forEach(function(a){a.mons.forEach(function(m){if(m.dex&&!seen[m.dex]){seen[m.dex]=1;tmp.push({id:m.dex,name:m.name.replace(/ de (Alola|Hisui|Galar|Paldea)$/,'')});}});});
  setSpecies(tmp);
  fetch('https://pokeapi.co/api/v2/pokemon-species?limit=1025').then(function(r){return r.json();}).then(function(d){
    var l=d.results.map(function(r){return {id:+r.url.replace(/\/$/,'').split('/').pop(),name:cap(r.name)};}).sort(function(a,b){return a.id-b.id;});
    try{localStorage.setItem(LSP,JSON.stringify(l));}catch(e){}
    setSpecies(l);loadForms();
  }).catch(function(){toast('Sem internet: o autocomplete só tem os Pokémon já registrados.');});
})();

function boot(){
  updateAuthBtn();
  if(CLOUD&&!A.session)showGate('in');
  else if(logged())resume();
  show('home');
}
boot();
})();
</script>
<script>
(function(){
  var KEY='gestgo.instx';
  function standalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
  function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;}
  function can(){return !standalone()&&(!!window.__dp||ios());}
  function dismissed(){try{return sessionStorage.getItem(KEY)==='1';}catch(e){return false;}}
  var el=document.createElement('div');el.id='instBar';
  el.innerHTML='<span>📲 Instale o app na tela inicial</span><button id="instGo" type="button">Instalar</button><button id="instX" type="button" aria-label="Fechar">✕</button>';
  var mn=document.querySelector('main');mn.parentNode.insertBefore(el,mn);
  function refresh(){
    var g=document.getElementById('gate'),open=g&&g.className.indexOf('on')>=0;
    el.style.display=(can()&&!dismissed()&&!open)?'flex':'none';
  }
  function install(){
    if(window.__dp){
      var d=window.__dp;d.prompt();
      d.userChoice.then(function(){window.__dp=null;refresh();},function(){});
    }else if(ios()){
      alert('No iPhone: toque no botão Compartilhar (quadrado com uma seta) e escolha "Adicionar à Tela de Início".');
    }
  }
  window.pwaCan=can;window.pwaInstall=install;
  document.getElementById('instGo').addEventListener('click',install);
  document.getElementById('instX').addEventListener('click',function(){try{sessionStorage.setItem(KEY,'1');}catch(e){}refresh();});
  window.addEventListener('pwa-ready',refresh);
  window.addEventListener('appinstalled',function(){window.__dp=null;refresh();});
  var g=document.getElementById('gate');
  if(g&&window.MutationObserver)new MutationObserver(refresh).observe(g,{attributes:true,attributeFilter:['class']});
  refresh();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
