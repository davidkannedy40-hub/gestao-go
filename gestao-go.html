  2) Build > Authentication > Comecar > Metodo de login > E-mail/senha: ATIVE

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /gestao/{uid} {
           allow read, write: if request.auth != null && request.auth.uid == uid;
         }
       }
     }

  4) Engrenagem > Configuracoes do projeto > Seus apps > Web (</>) > registrar app.
     Copie o objeto firebaseConfig e cole em FB_CONFIG, no comeco do script abaixo.

<style>

button{cursor:pointer}

.top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:50%;background:var(--yel);display:grid;place-items:center;flex:none;font-size:22px}
h1{font:800 22px/1 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
.sub{font-size:12px;color:#B8C3D6}
main{max-width:1100px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:800 24px/1 'Bricolage Grotesque',sans-serif}
.stat span{font-size:12px;color:var(--mut);font-weight:600}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ac{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;border-left:8px solid var(--c,var(--yel))}
.ac .n{font:800 17px/1.1 'Bricolage Grotesque',sans-serif}
.ac .nk{font-size:12px;color:var(--mut);min-height:1.2em}
.ac .nums{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{padding:3px 9px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700}
.pill.y{background:#FFF0BF}
.strip{display:flex;gap:2px;height:40px;overflow:hidden}
.strip img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.btn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;min-height:42px}
.btn.y{background:var(--yel);color:var(--ink)}
.btn.o{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.r{background:#fff;color:var(--red);border:2px solid var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.in{flex:1 1 150px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
textarea.in{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.mon{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;content-visibility:auto;contain-intrinsic-size:170px 150px}
.mon.y{border-color:var(--yel-d);background:#FFFBEA}
.mon.p{border-style:dashed;border-color:var(--yel-d)}
.mon img{width:80px;height:80px;image-rendering:pixelated;object-fit:contain}

.mon .dx{font-size:11px;color:var(--mut)}

.bar{flex-wrap:wrap}
.mon{position:relative;cursor:pointer;font:inherit}

.prev img{width:30px;height:30px;image-rendering:pixelated}

.ck{display:flex!important;align-items:center;gap:8px;font-size:14px!important;color:var(--ink)!important;margin:10px 0 0!important}

#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto;padding:24px 16px}
#gate.on{display:block}

.gbox .in{margin-bottom:8px}
#lb{align-items:center;padding:12px;z-index:90}
#lbImg{max-width:100%;max-height:90vh;border-radius:12px;background:#fff}
.lg{font-size:12px;color:var(--mut);margin:6px 0 0}
.mon img.art,.who img.art,.strip img.art{image-rendering:auto}

</head>

function cn(n){return (n||'').replace(/\s*·?\s*brilhante incerto/i,'').replace(/^\s*·\s*/,'').trim();}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}

}

/* ---------- Login, nuvem e fotos ---------- */
var CLOUD=!!(FB_CONFIG.apiKey&&FB_CONFIG.projectId&&window.firebase);
var A=loadAuth(),SYNC='',pushT=null,SYNCING=false,PHC={};
var fbAuth=null,fbDb=null,authReady=Promise.resolve(),unsub=null;
if(CLOUD){
  try{
    firebase.initializeApp(FB_CONFIG);fbAuth=firebase.auth();fbDb=firebase.firestore();
    authReady=new Promise(function(res){var un=fbAuth.onAuthStateChanged(function(){un();res();});});
  }catch(e){CLOUD=false;}
}
function loadAuth(){var a=null;try{a=JSON.parse(localStorage.getItem(LSA)||'null');}catch(e){}a=a||{};return {owner:a.owner||'',session:a.session||null,cloudTs:a.cloudTs||'',dirty:!!a.dirty,skip:!!a.skip};}
function saveAuth(){try{localStorage.setItem(LSA,JSON.stringify(A));}catch(e){}}
function logged(){return CLOUD&&!!A.session;}
function mailOf(u){return u+'@gestaogo.app';}
function setSession(user){A.session={uid:user.uid};saveAuth();}
function ensure(){
  if(!A.session||!CLOUD)return Promise.resolve();
  return authReady.then(function(){
    if(!fbAuth.currentUser){A.session=null;saveAuth();toast('Sua sessão expirou. Entre de novo.');updateAuthBtn();showGate();}
  });
}
function errMsg(m){
  m=String(m||'');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/i.test(m))return 'Usuário ou senha incorretos';
  if(/email-already-in-use/i.test(m))return 'Esse usuário já existe. Toque em Entrar.';
  if(/weak-password/i.test(m))return 'A senha precisa ter 6 caracteres ou mais';
  if(/operation-not-allowed/i.test(m))return 'No Firebase, ative o login por E-mail/senha (veja o topo do arquivo).';
  if(/too-many-requests/i.test(m))return 'Muitas tentativas. Espere um pouco e tente de novo.';
  if(/network/i.test(m))return 'Sem conexão. Tente de novo.';
  return 'Não deu certo: '+m;
}
function setSync(s){SYNC=s;updateAuthBtn();}
function updateAuthBtn(){
  var b=$('authBtn');if(!b)return;
  b.textContent=!CLOUD?'👤 Login':(logged()?'👤 '+A.owner+' '+(SYNC==='busy'?'⏳':SYNC==='err'?'⚠️':'☁️'):'👤 Entrar');
}
function markDirty(){
  if(!logged())return;
  A.dirty=true;saveAuth();setSync('busy');
  clearTimeout(pushT);
  pushT=setTimeout(function(){pushCloud().then(function(){return syncPhotos();});},2500);
}
function totalMons(d){var n=0;((d&&d.accounts)||[]).forEach(function(a){n+=(a.mons||[]).length;});return n;}
function fixAccounts(d){d.accounts.forEach(function(a){a.mons=a.mons||[];a.color=a.color||COLORS[0];a.name=a.name||'Conta';a.nick=a.nick||'';a.code=a.code||'';a.note=a.note||'';});return migrate(d);}
function pullCloud(){
  return ensure().then(function(){
    if(!logged())throw new Error('nosession');
    return fbDb.collection('gestao').doc(A.session.uid).get();
  }).then(function(s){
    if(!s.exists)return null;
    var d=s.data();
    return {data:JSON.parse(d.json),updated_at:d.updated_at};
  });
}
function pushCloud(){
  if(!logged())return Promise.resolve(false);
  if(!navigator.onLine){setSync('err');return Promise.resolve(false);}
  var ts=new Date().toISOString();
  return ensure().then(function(){
    if(!logged())return false;
    return fbDb.collection('gestao').doc(A.session.uid).set({json:JSON.stringify(D),updated_at:ts})
    .then(function(){A.cloudTs=ts;A.dirty=false;saveAuth();setSync('ok');return true;});
  }).catch(function(){setSync('err');return false;});
}
function watch(){
  if(!logged()||unsub)return;
  unsub=fbDb.collection('gestao').doc(A.session.uid).onSnapshot(function(s){
    if(!s.exists||s.metadata.hasPendingWrites||A.dirty)return;
    var d=s.data();
    if(!d||d.updated_at===A.cloudTs)return;
    if($('md').className.indexOf('on')>=0)return;
    try{applyCloud({data:JSON.parse(d.json),updated_at:d.updated_at});}catch(e){return;}
    draw();toast('Atualizado de outro aparelho');
  },function(){});
}
function unwatch(){if(unsub){unsub();unsub=null;}}
function applyCloud(row){
  D=fixAccounts(row.data);D.v=D.v||3;
  try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}
  A.cloudTs=row.updated_at;A.dirty=false;saveAuth();
}
function startSync(){
  if(!logged())return Promise.resolve();
  setSync('busy');
  return pullCloud().then(function(row){
    if(!row||!row.data)return pushCloud();
    var same=A.cloudTs&&new Date(row.updated_at).getTime()===new Date(A.cloudTs).getTime();
    if(same){if(A.dirty)return pushCloud();setSync('ok');return null;}
    if(A.dirty&&!confirm('Este aparelho e a nuvem têm alterações diferentes.\n\nOK = usar os dados da nuvem (descarta as alterações deste aparelho)\nCancelar = enviar os deste aparelho para a nuvem'))return pushCloud();
    applyCloud(row);setSync('ok');draw();return null;
  }).then(function(){watch();}).catch(function(){setSync('err');});
}
function doLogin(up){
  var u=norm($('lgU').value||'').replace(/[^a-z0-9._-]/g,''),pw=$('lgP').value||'';
  if(u.length<3){toast('Usuário: mínimo 3 letras ou números');return;}
  if(pw.length<6){toast('A senha precisa ter 6 caracteres ou mais');return;}
  var p=up?fbAuth.createUserWithEmailAndPassword(mailOf(u),pw):fbAuth.signInWithEmailAndPassword(mailOf(u),pw);
  p.then(function(c){setSession(c.user);return afterLogin(u);}).catch(function(e){toast(errMsg(e.code||e.message));});
}
function afterLogin(u){
  var other=A.owner&&A.owner!==u;
  if(other){
    if(A.dirty&&!confirm('Há alterações de "'+A.owner+'" neste aparelho que não foram para a nuvem. Entrar como "'+u+'" vai descartá-las. Continuar?')){A.session=null;saveAuth();return Promise.resolve();}
    D=defaults();A.dirty=false;A.cloudTs='';
  }
  setSync('busy');
  return pullCloud().then(function(row){
    var localN=totalMons(D),cloudN=row&&row.data?totalMons(row.data):0,useCloud=false;
    if(row&&row.data){
      if(localN===0)useCloud=true;
      else if(A.owner===u&&!A.dirty)useCloud=true;
      else useCloud=confirm('Encontrei dados na nuvem ('+cloudN+' Pokémon) e também neste aparelho ('+localN+').\n\nOK = usar os da nuvem (os deste aparelho ficam num backup interno)\nCancelar = enviar os deste aparelho para a nuvem (substitui a nuvem)');
    }
    A.owner=u;saveAuth();
    if(useCloud){try{localStorage.setItem('gestgo.bak.v1',JSON.stringify(D));}catch(e){}applyCloud(row);setSync('ok');return null;}
    return pushCloud();
  }).then(function(){watch();}).then(function(){
    hideGate();$('md').className='modal';updateAuthBtn();show('home');toast('Bem-vindo, '+u);
  }).catch(function(){
    setSync('err');toast('Entrou, mas não consegui sincronizar. Confira a configuração do Firebase.');hideGate();updateAuthBtn();show('home');
  });
}
function doLogout(){
  var go=function(){
    unwatch();if(CLOUD)fbAuth.signOut().catch(function(){});
    A.session=null;A.owner='';A.cloudTs='';A.dirty=false;A.skip=false;saveAuth();
    Object.keys(PHC).forEach(dropCache);
    D=defaults();try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}
    $('md').className='modal';updateAuthBtn();show('home');showGate();
  };
  if(A.dirty){pushCloud().then(function(ok){if(!ok&&!confirm('Não consegui enviar as últimas alterações para a nuvem. Sair mesmo assim e perder essas alterações?'))return;go();});}
  else go();
}

/* fotos originais: nuvem (logado) ou neste aparelho (IndexedDB) */
function idbo(mode,fn){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('noidb'));return;}
    var r=indexedDB.open('gestgo-photos',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('p');};
    r.onerror=function(){rej(r.error);};
    r.onsuccess=function(){var db=r.result,tx=db.transaction('p',mode),q=fn(tx.objectStore('p'));tx.oncomplete=function(){res(q&&q.result);db.close();};tx.onerror=function(){rej(tx.error);};};
  });
}
function idbPut(k,v){return idbo('readwrite',function(s){return s.put(v,k);});}
function idbGet(k){return idbo('readonly',function(s){return s.get(k);});}
function idbDel(k){return idbo('readwrite',function(s){return s.delete(k);});}
function dropCache(id){if(PHC[id]){try{URL.revokeObjectURL(PHC[id]);}catch(e){}delete PHC[id];}}
function storePhoto(m,file){
  dropCache(m.id);
  return idbPut(m.id,file).then(function(){m.ph='l';}).catch(function(){toast('Não consegui guardar a foto');});
}
function removePhoto(m){
  dropCache(m.id);m.ph='';
  return idbDel(m.id).catch(function(){});
}
function photoUrl(m){
  if(PHC[m.id])return Promise.resolve(PHC[m.id]);
  if(!m.ph)return Promise.resolve(null);
  return idbGet(m.id).then(function(b){return b?(PHC[m.id]=URL.createObjectURL(b)):null;}).catch(function(){return null;});
}
function syncPhotos(){return Promise.resolve();}
function curMon(){var a=acc(M.acc);return(M.mon&&a)?a.mons.filter(function(x){return x.id===M.mon;})[0]:null;}

}

var CHIPS=[['all','Todos'],['y','✨ Brilhantes'],['n','Normais'],['p','❓ Prováveis'],['S','🌑 Sombrios'],['L','🍀 Sortudos'],['it','🎩 Com item'],['B','🖼️ Fundo'],['ph','📷 Com foto'],['mega','🧬 Mega'],['gmax','🌋 Gigamax'],['D','🔴 Dinamax'],['reg','🌍 Regionais'],['alt','🔀 Outras formas'],['leg','🦄 Lendários'],['myt','🔮 Místicos'],['crown','👑 Coroados'],['ub','🌀 Ultra Entes'],['par','⚡ Paradoxos']];
var FOP='and';
function rng(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}
function setOf(l){var o={};l.forEach(function(x){o[x]=1;});return o;}
var DX_LEG=setOf([144,145,146,150,243,244,245,249,250].concat(rng(377,384),[480,481,482,483,484,485,486,487,488],rng(638,646),[716,717,718,772,773],rng(785,792),[800,888,889,890,891,892],rng(894,898),[905],rng(1001,1004),[1007,1008,1024]));
var DX_MYT=setOf([151,251,385,386,489,490,491,492,493,494,647,648,649,719,720,721,801,802,807,808,809,893,1014,1015,1016,1017,1025]);
var DX_UB=setOf(rng(793,799).concat(rng(803,806)));
var DX_PAR=setOf(rng(984,995).concat([1005,1006,1009,1010],rng(1020,1023)));
function oneF(m,f){
  if(f==='leg')return !!DX_LEG[m.dex];
  if(f==='myt')return !!DX_MYT[m.dex];
  if(f==='ub')return !!DX_UB[m.dex];
  if(f==='par')return !!DX_PAR[m.dex];
  if(f==='crown')return /crowned|coroad/i.test((m.fk||'')+' '+(m.name||''));
  if(f==='y'||f==='p'||f==='n')return m.sh===f;
  if(f==='it')return /[PGC]/.test(m.t);
  if(f==='ph')return !!m.ph;
  if(f==='mega'||f==='gmax'||f==='reg'||f==='alt')return kindOf(m.fk)===f;
  return m.t.indexOf(f)>=0;
}
function passes(m,ff){
  var f=ff||V.f; if(!f.length)return true;
  return FOP==='or'?f.some(function(k){return oneF(m,k);}):f.every(function(k){return oneF(m,k);});
}
function togF(arr,k){
  if(k==='all'){arr.length=0;return;}
  var i=arr.indexOf(k);
  if(i>=0){arr.splice(i,1);return;}
  if(k==='y'||k==='p'||k==='n'){['y','p','n'].forEach(function(x){var j=arr.indexOf(x);if(j>=0)arr.splice(j,1);});}
  arr.push(k);
}
function chipsH(attr,arr){
  return CHIPS.map(function(c){var on=c[0]==='all'?!arr.length:arr.indexOf(c[0])>=0;return '<button type="button" class="chip" '+attr+'="'+c[0]+'" aria-pressed="'+on+'">'+c[1]+'</button>';}).join('');
}
function opH(){
  return '<div class="chips" style="margin-top:8px" role="group" aria-label="Combinar filtros"><button type="button" class="chip" data-fop="and" aria-pressed="'+(FOP==='and')+'">E · todos juntos</button><button type="button" class="chip" data-fop="or" aria-pressed="'+(FOP==='or')+'">OU · qualquer um</button></div>';
}
function syncChips(attr,arr){
  var cs=document.querySelectorAll('['+attr+']');
  for(var i=0;i<cs.length;i++){var k=cs[i].getAttribute(attr);cs[i].setAttribute('aria-pressed',String(k==='all'?!arr.length:arr.indexOf(k)>=0));}
}
function syncOp(){var o=document.querySelectorAll('[data-fop]');for(var i=0;i<o.length;i++)o[i].setAttribute('aria-pressed',String(o[i].getAttribute('data-fop')===FOP));}
function renderAcc(){
  var a=acc(V.acc); if(!a){show('home');return;}
  var h='<div class="bar"><button type="button" class="btn o" data-back="1">← Voltar</button><h2>'+esc(a.name)+'</h2><button type="button" class="btn o" data-allsh="1">✨ Todos Shine</button><button type="button" class="btn o" data-import="'+a.id+'">📋 Importar</button><button type="button" class="btn o" data-editacc="1">Editar</button></div>';
  if(a.nick||a.code||a.note) h+='<p style="margin:0 0 8px;color:#5D6B82">'+esc([a.nick&&'Nick: '+a.nick,a.code&&'Código: '+a.code,a.note].filter(Boolean).join(' · '))+'</p>';
  h+='<div class="tools"><input class="in" id="aq" type="search" placeholder="Buscar nome, número ou anotação" value="'+esc(V.q)+'"></div><div class="chips" role="group" aria-label="Filtro">'+
    chipsH('data-f',V.f)+'</div>'+opH()+'<div class="chips" style="margin-top:8px" role="group" aria-label="Modo"><button type="button" class="chip" data-vmode="list" aria-pressed="'+(V.mode==='list')+'">Todos os Pokémon</button><button type="button" class="chip" data-vmode="sp" aria-pressed="'+(V.mode==='sp')+'">Espécies diferentes</button></div>'+
    '<p id="alc" style="color:#5D6B82;margin:10px 0 8px"></p><div id="alist"></div>';
  $('v-acc').innerHTML=h; drawList();
}
function matchQ(m,q){
  if(!q)return true;
  return norm(m.name).indexOf(q)>=0||String(m.dex)===q.replace('#','')||norm(m.note||'').indexOf(q)>=0;
}
function drawList(){
  var a=acc(V.acc),q=norm(V.q),box=$('alist'); if(!a||!box)return;
  var list=a.mons.filter(function(m){return passes(m)&&matchQ(m,q);}).sort(function(x,y){return x.dex-y.dex||x.name.localeCompare(y.name);});
  if(V.mode==='sp'){
    var g={},order=[];
    list.forEach(function(m){var o=g[m.name];if(!o){o=g[m.name]={m:m,n:0,y:0};order.push(m.name);}o.n++;if(m.sh==='y'){o.y++;if(o.m.sh!=='y')o.m=m;}});
    $('alc').textContent=order.length+' espécies diferentes · '+list.length+' Pokémon de '+a.mons.length;
    box.innerHTML=order.length?'<div class="grid">'+order.map(function(k){var o=g[k];
      return '<button type="button" class="mon '+(o.y?'y':'n')+'" data-spf="'+esc(k)+'">'+(o.n>1?'<span class="cnt">×'+o.n+'</span>':'')+img(o.m)+'<div class="nm">'+esc(k)+'</div><div class="dx">#'+('000'+o.m.dex).slice(-3)+'</div></button>';}).join('')+'</div>':'<div class="empty">'+(a.mons.length?'Nada com esse filtro.':'Esta conta ainda está vazia. Toque no + para adicionar.')+'</div>';
    return;
  }
  $('alc').textContent=list.length+' de '+a.mons.length+' Pokémon';
  box.innerHTML=list.length?'<div class="grid">'+list.map(function(m){
    return monCard(m,a,false);
  }).join('')+'</div>':'<div class="empty">'+(a.mons.length?'Nada com esse filtro.':'Esta conta ainda está vazia. Toque no + para adicionar.')+'</div>';
}

function monCard(m,a,showAcc){
  return '<div class="mon '+m.sh+'" data-mon="'+m.id+'" data-ac="'+a.id+'" role="button" tabindex="0">'+
    '<button type="button" class="star'+(m.sh==='y'?' on':'')+'" data-tog="'+m.id+'" data-ac="'+a.id+'" aria-pressed="'+(m.sh==='y')+'" aria-label="Alternar brilhante">✨</button>'+
    img(m)+'<div class="nm">'+esc(m.name)+'</div><div class="dx">#'+('000'+m.dex).slice(-3)+'</div><div class="bd">'+badges(m)+'</div>'+
    (showAcc?'<div class="nt"><b style="color:'+a.color+'">●</b> '+esc(a.name)+'</div>':'')+
    (m.note?'<div class="nt">'+esc(m.note)+'</div>':'')+'</div>';
}
function toggleSh(aid,mid){
  var a=acc(aid),m=a&&a.mons.filter(function(x){return x.id===mid;})[0]; if(!m)return;
  m.sh=m.sh==='y'?'n':'y'; save();
  if(V.tab==='acc')drawList();else if(V.tab==='all')drawAll();
  toast(m.sh==='y'?'✨ '+m.name+' é brilhante':m.name+' marcado como normal');
}

var G={q:'',f:[],acc:'all',mode:'list'};
function renderAll(){
  var opts=D.accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join('');
  $('v-all').innerHTML='<div class="bar"><h2>Gestão geral</h2></div><div class="tools"><input class="in" id="gq" type="search" placeholder="Buscar nome, número ou anotação" value="'+esc(G.q)+'"><select class="in" id="gacc"><option value="all">Todas as contas</option>'+opts+'</select></div>'+
   '<div class="chips" role="group" aria-label="Filtro">'+chipsH('data-gf',G.f)+'</div>'+opH()+
   '<div class="chips" style="margin-top:8px" role="group" aria-label="Modo"><button type="button" class="chip" data-gmode="list" aria-pressed="'+(G.mode==='list')+'">Todos os Pokémon</button><button type="button" class="chip" data-gmode="sp" aria-pressed="'+(G.mode==='sp')+'">Por espécie</button></div>'+
   '<p id="glc" style="color:#5D6B82;margin:10px 0 8px"></p><div id="glist"></div>';
  $('gacc').value=G.acc; drawAll();
}
function drawAll(){
  var box=$('glist'); if(!box)return;
  var q=norm(G.q),list=[];
  D.accounts.forEach(function(a){
    if(G.acc!=='all'&&a.id!==G.acc)return;
    a.mons.forEach(function(m){if(passes(m,G.f)&&matchQ(m,q))list.push({a:a,m:m});});
  });
  list.sort(function(x,y){return x.m.dex-y.m.dex||x.m.name.localeCompare(y.m.name);});
  var spc={},shc=0; list.forEach(function(e){spc[e.m.name]=1;if(e.m.sh==='y')shc++;});
  $('glc').textContent=list.length+' Pokémon · '+Object.keys(spc).length+' espécies · ✨ '+shc;
  if(!list.length){box.innerHTML='<div class="empty">Nada com esse filtro.</div>';return;}
  if(G.mode==='list'){box.innerHTML='<div class="grid">'+list.map(function(e){return monCard(e.m,e.a,true);}).join('')+'</div>';return;}
  var g={},order=[];
  list.forEach(function(e){var k=e.m.name;if(!g[k]){g[k]={m:e.m,n:0,by:{},y:0};order.push(k);}var o=g[k];o.n++;if(e.m.sh==='y'){o.y++;if(o.m.sh!=='y')o.m=e.m;}
    if(!o.by[e.a.id])o.by[e.a.id]={a:e.a,n:0};o.by[e.a.id].n++;});
  box.innerHTML='<div class="grid">'+order.map(function(k){var o=g[k];
    return '<button type="button" class="mon '+(o.y?'y':'n')+'" data-who="'+esc(k)+'">'+(o.n>1?'<span class="cnt">×'+o.n+'</span>':'')+img(o.m)+'<div class="nm">'+esc(k)+'</div><div class="dx">#'+('000'+o.m.dex).slice(-3)+'</div><div class="dots">'+
      Object.keys(o.by).map(function(id){var x=o.by[id];return '<i style="border-left:4px solid '+x.a.color+'">'+esc(x.a.name)+(x.n>1?' ×'+x.n:'')+'</i>';}).join('')+'</div></button>';}).join('')+'</div>';
}

    var fk=form,fl2=formsFor(sp.id);
    if(form==='paldea'&&sp.id===128)fk=has(/aqua|agua/)?'paldea-aqua-breed':has(/chama|blaze|fogo|fire/)?'paldea-blaze-breed':'paldea-combat-breed';
    else if(!form){
      if(gm2){var gl=fl2.filter(function(f){return kindOf(f.k)==='gmax';});fk=(gl.filter(function(f){return has(/fluido|rapid/)===/rapid/.test(f.k);})[0]||gl[0]||{k:'gmax'}).k;}
      else if(mg2||pr2){fk=pr2?'primal':(xy?'mega-'+xy:'mega');if(!fl2.some(function(f){return f.k===fk;})){var mf=fl2.filter(function(f){return kindOf(f.k)==='mega';})[0];if(mf)fk=mf.k;}}
      else{
        var al=fl2.filter(function(f){return kindOf(f.k)==='alt';});
        al.forEach(function(f){if(fk)return;var terms=[norm(lbl(f.k)),f.k.replace(/-/g,' ')];if(terms.some(function(tm){return tm.length>3&&new RegExp('\\b'+tm+'\\b').test(n);}))fk=f.k;});
        if(!fk&&/\b(origem|original|origin)\b/.test(n)&&al.some(function(f){return f.k==='origin';}))fk='origin';
      }
    }
    var spid=formId(sp.id,fk)||(FSP[form]||{})[sp.id]||0;
    if(form==='paldea'&&sp.id===128&&!spid)spid=fk==='paldea-aqua-breed'?10252:fk==='paldea-blaze-breed'?10251:10250;
    ok.push({sp:sp,qty:qty,name:mkName(sp.id,fk)||sp.name,fk:fk,spid:spid,sh:sh,t:t,note:note});
  });

}

  if(b.id==='bkFile'){$('bkIn').click();return;}
  if(b.id==='bkImp'){var t2=$('bkTxt').value.trim();if(!t2){toast('Cole o backup primeiro');return;}if(confirm('Isso substitui tudo. Continuar?'))importData(t2);return;}
  if(b.id==='bkReset'){if(confirm('Apagar tudo e recomeçar?')){D=defaults();save();toast('Recomeçado');show('home');}return;}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='aq'){V.q=t.value;drawList();}
  else if(t.id==='wq'){WQ=t.value;drawWho();}
  else if(t.id==='gq'){G.q=t.value;drawAll();}
  else if(t.id==='mName'){M.dex=0;M.name='';M.fk='';$('pick').textContent='';suggest(t.value);var q9=norm(t.value).trim(),ex=q9&&SP.filter(function(x){return norm(x.name)===q9;})[0];if(ex){M.dex=ex.id;M.name=ex.name;M.sp=0;$('pick').textContent='✓ '+ex.name+' #'+ex.id;}refreshForms();}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='lgP'||e.target.id==='lgU'))doLogin(false);});
document.addEventListener('change',function(e){
  if(e.target.id==='mForm'){M.fk=e.target.value;return;}
  if(e.target.id==='mFile'&&e.target.files[0]){var pf=e.target.files[0];if(pf.size>40*1024*1024){toast('Foto muito grande (máximo 40 MB)');return;}M.file=pf;M.rm=false;renderPh();return;}
  if(e.target.id==='gacc'){G.acc=e.target.value;drawAll();return;}
  if(e.target.id==='iFile'&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){$('iTxt').value=String(fr.result);readImport();};fr.readAsText(e.target.files[0]);return;}
  if(e.target.id==='bkIn'&&e.target.files[0]){var r=new FileReader();r.onload=function(){if(confirm('Isso substitui tudo. Continuar?'))importData(String(r.result));};r.readAsText(e.target.files[0]);}
});

/* ---------- Lista de espécies (para o autocomplete) ---------- */
function setSpecies(l){SP=l;SPN={};l.forEach(function(s){SPN[s.id]=s.name;});}
function cap(n){return n.split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');}
(function(){
  var c=null;try{c=JSON.parse(localStorage.getItem(LSP)||'null');}catch(e){}
  if(c&&c.length>1000){setSpecies(c);loadForms();return;}
  var seen={},tmp=[];
  D.accounts.forEach(function(a){a.mons.forEach(function(m){if(m.dex&&!seen[m.dex]){seen[m.dex]=1;tmp.push({id:m.dex,name:m.name.replace(/ de (Alola|Hisui|Galar|Paldea)$/,'')});}});});
  setSpecies(tmp);
  fetch('https://pokeapi.co/api/v2/pokemon-species?limit=1025').then(function(r){return r.json();}).then(function(d){
    var l=d.results.map(function(r){return {id:+r.url.replace(/\/$/,'').split('/').pop(),name:cap(r.name)};}).sort(function(a,b){return a.id-b.id;});
    try{localStorage.setItem(LSP,JSON.stringify(l));}catch(e){}
    setSpecies(l);loadForms();
  }).catch(function(){toast('Sem internet: o autocomplete só tem os Pokémon já registrados.');});
})();

function boot(){
  updateAuthBtn();
  if(CLOUD&&!A.session&&!A.skip)showGate();
  else if(logged())startSync();
  show('home');
}
boot();
})();
</script>
